name: Windows parity build
on:
  push:
    branches: [windows/android-parity-clean]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore src/PlayerOne.Windows/PlayerOne.Windows.csproj
      - name: Build
        run: dotnet build src/PlayerOne.Windows/PlayerOne.Windows.csproj -c Release --no-restore
      - name: Publish
        run: dotnet publish src/PlayerOne.Windows/PlayerOne.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: Player-One-Windows-Portable
          path: publish/
